name: Build and publish PDF Toolbox Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Publish build to the Pages branch root
        working-directory: .
        run: |
          rm -rf -- assets licenses fonts pdfjs tesseract
          cp -R web/dist/. .
          touch .nojekyll
          git add -- index.html assets favicon.svg licenses fonts pdfjs tesseract .nojekyll
          if git diff --cached --quiet; then
            echo "Deployed files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update deployed PDF Toolbox web app"
          git push
