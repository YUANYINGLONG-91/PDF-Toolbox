[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-toolbox"
version = "1.0.0"
description = "Local PDF Toolbox for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10",
  "Pillow>=11,<13",
  "img2pdf>=0.5,<1",
  "pikepdf>=9,<11",
  "PyMuPDF>=1.24,<2",
  "pdf2docx>=0.5.8,<1",
  "python-docx>=1.1,<2",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8,<10",
  "reportlab>=4,<5",
]

[project.scripts]
pdf-toolbox = "pdf_toolbox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
